/* Mist refinement layer: preserve original palette, improve motion quality and hierarchy */
:root{
  --motion-fast:150ms;
  --motion-mid:280ms;
  --motion-page:380ms;
  --ease-liquid:cubic-bezier(.22,1,.36,1);

html{scroll-behavior:smooth}

}

.card,.acard,.strip,.hero,.tag,nav,.fab,button.b,input,select,textarea,.chips button,.seg button{

<div id="app"><nav id="nav"></nav><main id="main"></main></div>

<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter></svg><div id="blobs"><i></i><i></i></div><dialog id="dlg"></dialog><div id="toast"></div>
<script>
const CAT={in:['Gaji','Uang saku','Usaha','Freelance','Bonus','Hadiah','Hasil investasi','Pemasukan lain'],out:['Makanan & minuman','Transportasi','Belanja','Hiburan','Pendidikan','Kesehatan','Tagihan & utilitas','Langganan','Perawatan diri','Keluarga','Donasi','Perjalanan','Pengeluaran lain']};
let S;try{S=JSON.parse(localStorage.getItem('pfm1'))}catch(e){}
S=S||{acc:[],cat:CAT,subcat:{in:{},out:{}},tx:[],bud:{},goals:[],debts:[],hide:0};
S.subcat=S.subcat||{in:{},out:{}};S.subcat.in=S.subcat.in||{};S.subcat.out=S.subcat.out||{};
const save=()=>{try{localStorage.setItem('pfm1',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n<0?'−':'')+'Rp'+Math.round(Math.abs(n)).toLocaleString('id-ID');
const sec=n=>S.hide?'Rp•••••':fmt(n);
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const mk=d=>d.slice(0,7);const curM=()=>today().slice(0,7);
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)};
const cat=()=>`<svg width="64" height="56" viewBox="0 0 64 56" fill="none"><path d="M10 50C6 30 12 20 14 12L24 20Q32 17 40 20L50 12C52 20 58 30 54 50Q32 56 10 50Z" fill="#111" stroke="#111" stroke-width="2" stroke-linejoin="round"/><circle cx="24" cy="34" r="5" fill="#fff"/><circle cx="41" cy="34" r="5" fill="#fff"/><circle cx="25" cy="34" r="1.8" fill="#111"/><circle cx="40" cy="34" r="1.8" fill="#111"/></svg>`;
const CP='<path d="M10 50C6 30 12 20 14 12L24 20Q32 17 40 20L50 12C52 20 58 30 54 50Q32 56 10 50Z" fill="#111" stroke="#111" stroke-width="2" stroke-linejoin="round"/><circle cx="24" cy="34" r="5.5" fill="#fff"/><circle cx="41" cy="34" r="5.5" fill="#fff"/><circle cx="25" cy="34" r="1.8" fill="#111"/><circle cx="40" cy="34" r="1.8" fill="#111"/>';
const sv=(i,w,vb)=>`<svg width="${w}" height="${w*.7}" viewBox="${vb||'0 0 96 66'}" fill="none" style="max-width:100%;filter:url(#rough)">${i}</svg>`;
const LN=(i,w)=>`<svg width="${w}" height="${w*.67}" viewBox="0 0 120 80" fill="none" stroke="#4A5C6A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${i}</svg>`;
const MT=()=>`<svg viewBox="0 0 800 340" preserveAspectRatio="xMidYMax slice" width="100%" height="100%"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BA8AB"/><stop offset=".6" stop-color="#CCD0CF"/><stop offset="1" stop-color="#E6E9E8"/></linearGradient><radialGradient id="mn"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><radialGradient id="fg"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect x="-50" width="900" height="340" fill="url(#sk)"/><g class="px" data-s="6"><circle class="glow" cx="560" cy="92" r="90" fill="url(#mn)"/><circle cx="560" cy="92" r="26" fill="#fff" opacity=".92"/></g><g class="px" data-s="14"><path d="M-40 240C20 220 70 160 130 170C190 180 220 210 280 130C320 75 360 60 400 95C450 140 480 175 540 165C600 155 650 185 720 175C770 168 810 180 840 175V340H-40Z" fill="#4A5C6A" opacity=".5"/></g><g class="fog"><ellipse cx="180" cy="215" rx="260" ry="36" fill="url(#fg)"/></g><g class="px" data-s="26"><path d="M-40 285C40 260 110 215 170 225C230 235 270 270 340 190C390 135 430 125 480 175C530 225 570 215 620 205C690 192 760 240 840 230V340H-40Z" fill="#253745" opacity=".92"/></g><g class="fog f2"><ellipse cx="640" cy="268" rx="320" ry="40" fill="url(#fg)"/></g><g class="px" data-s="40"><path d="M-40 322C60 300 130 285 210 300C290 315 340 280 420 290C500 300 560 318 650 300C730 285 790 300 840 295V340H-40Z" fill="#11212D"/></g><path d="M-40 340V328C80 316 170 334 280 326C400 318 480 336 600 326C700 318 780 330 840 326V340Z" fill="#06141B"/></svg>`;
const DOO=[w=>MT(),w=>LN('<circle cx="88" cy="22" r="9"/><path d="M6 66C20 66 26 30 40 30S52 50 62 42S80 40 96 66Z"/><path d="M6 72H114M20 77H100"/>',w),w=>LN('<path d="M30 52h56c0 6-8 12-12 12H42c-6 0-10-6-12-12Z"/><path d="M58 52V16C66 28 74 38 80 46c-8 4-14 6-22 6M52 52V26C48 36 44 44 38 52"/><path d="M6 70q14-8 28 0t28 0 28 0 28 0M18 76q12-6 24 0t24 0 24 0"/>',w),w=>LN('<ellipse cx="60" cy="58" rx="28" ry="9"/><path d="M32 58V48M88 58V48"/><ellipse cx="60" cy="48" rx="28" ry="9"/><path d="M32 48V38M88 48V38"/><ellipse cx="60" cy="38" rx="28" ry="9"/><path d="M52 38h16M60 34v8"/><circle cx="96" cy="14" r="2.5" fill="#4A5C6A"/><circle cx="26" cy="20" r="1.8" fill="#4A5C6A"/>',w)];
const doo=(i,w)=>DOO[i](w||120);
const empty=t=>`<div class="empty">${doo(1+(t.length%3),130)}<div>${t}</div></div>`;
function bal(a){let b=+a.open||0;for(const t of S.tx){if(t.type=='in'&&t.acc==a.id)b+=t.amt;else if(t.type=='out'&&t.acc==a.id)b-=t.amt;else if(t.type=='adj'&&t.acc==a.id)b+=t.amt;else if(t.type=='sv'&&t.acc==a.id)b-=t.amt;else if(t.type=='dp'&&t.acc==a.id){const d=S.debts.find(x=>x.id==t.debt);b+=(d&&d.kind=='lend')?t.amt:-t.amt}else if(t.type=='tf'){if(t.acc==a.id)b-=t.amt+(t.fee||0);if(t.to==a.id)b+=t.amt}}return b}
const total=()=>S.acc.reduce((s,a)=>s+bal(a),0);
const shown=()=>ACC?bal(S.acc.find(a=>a.id==ACC)||{open:0}):total();
const gs=g=>(+g.saved||0)+S.tx.filter(t=>t.type=='sv'&&t.goal==g.id).reduce((s,t)=>s+t.amt,0);
const svT=()=>S.tx.filter(t=>t.type=='sv').reduce((s,t)=>s+t.amt,0);
const sum=(f,ty)=>S.tx.filter(t=>t.type==ty&&f(t.date)&&(!ACC||V!='ov'||t.acc==ACC)).reduce((s,t)=>s+t.amt+(ty=='tf'?0:0),0);
const fees=f=>S.tx.filter(t=>t.type=='tf'&&f(t.date)&&(!ACC||V!='ov'||t.acc==ACC)).reduce((s,t)=>s+(t.fee||0),0);
const inM=m=>d=>mk(d)==m;
const prevM=m=>{let[y,n]=m.split('-').map(Number);n--;if(!n){n=12;y--}return y+'-'+String(n).padStart(2,'0')};
const accName=id=>(S.acc.find(a=>a.id==id)||{name:'(dihapus)'}).name;
const spent=(m,c)=>S.tx.filter(t=>t.type=='out'&&mk(t.date)==m&&(!c||t.cat==c)).reduce((s,t)=>s+t.amt,0);

const ic=p=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" fill-opacity=".13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={ov:ic('<path d="M3 11.5L12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),tx:ic('<path d="M7 7h12M15 3l4 4-4 4M17 17H5M9 13l-4 4 4 4" fill="none"/>'),ac:ic('<path d="M5 7h12V5H6a2 2 0 0 0-2 2" fill="none"/><rect x="3" y="7" width="18" height="13" rx="3.5"/><circle cx="16.5" cy="13.5" r="1.4" fill="currentColor" fill-opacity="1" stroke="none"/>'),an:ic('<rect x="4" y="12" width="4" height="8" rx="1.2"/><rect x="10" y="4" width="4" height="16" rx="1.2"/><rect x="16" y="9" width="4" height="11" rx="1.2"/>'),st:ic('<path d="M4 7h9M19 7h1M4 17h1M11 17h9" fill="none"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/>')};
const hi=()=>{const h=new Date().getHours();return h<4?'Selamat dini hari':h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam'};
const acard=(a,x='')=>`<div class="acard" style="--c:${a.color}"><div class="chip"></div><span class="atype">${esc(a.type)}</span><div class="aname">${esc(a.name)}</div><div class="abal">${sec(bal(a))}</div>${x}</div>`;
const PAL=['#06141B','#253745','#4A5C6A','#9BA8AB','#6f8796','#11212D','#CCD0CF'];
let ACC='',MON=curM(),V='ov',F={q:'',type:'',acc:'',cat:'',from:'',to:'',sort:'new'},AT='lap',P='month';
const NAV=[['ov','Ringkasan'],['tx','Transaksi'],['ac','Akun'],['an','Analitik'],['st','Pengaturan']];
function navUpd(){const n=$('nav');if(!n.dataset.b){n.dataset.b=1;n.innerHTML='<div class="logo"><svg width="28" height="20" viewBox="0 0 28 20" fill="none" stroke="#CCD0CF" stroke-width="1.6" stroke-linejoin="round"><path d="M1 19L10 4l5 8 3-4 9 11Z"/></svg>Mist</div>'+NAV.map(([k,t])=>`<button data-k="${k}" aria-label="${t}" onclick="go('${k}')"><span class="ico">${IC[k]}</span><span class="lb">${t}</span></button>`).join('')+'<i class="ind"></i>'}
const i=NAV.findIndex(x=>x[0]==V);n.style.setProperty('--i',i);n.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k==V));
if(n.dataset.i!=i){n.dataset.i=i;const d=n.querySelector('.ind');d.classList.remove('mv');void d.offsetWidth;d.classList.add('mv')}}
function go(v){const run=()=>{V=v;window.__nav=1;scrollTo({top:0,behavior:'instant'});render()};
 if(!document.startViewTransition||matchMedia('(prefers-reduced-motion:reduce)').matches)return run();
 const b=document.querySelector(`nav button[data-k="${v}"]`),r=b?b.getBoundingClientRect():{left:innerWidth/2,top:innerHeight,width:0,height:0},x=r.left+r.width/2,y=r.top+r.height/2,R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
 const t=document.startViewTransition(run);t.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},{duration:380,easing:'cubic-bezier(.22,1,.36,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{})}
function render(){
  navUpd();
  const m=$('main');m.innerHTML='<div class="view">'+({ov,tx,ac,an,st}[V])()+'</div>';
  if(V=='tx')list();document.querySelectorAll('.cu').forEach(e=>{if(S.hide||window.__still)return;const v=+e.dataset.v,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1000),k=1-Math.pow(1-p,3);e.textContent=fmt(v*k);if(p<1)requestAnimationFrame(f)})(t0)});
}
/* Overview */
function ov(){
  const m=MON,pm=prevM(m),I=sum(inM(m),'in'),E=sum(inM(m),'out')+fees(inM(m)),pI=sum(inM(pm),'in'),pE=sum(inM(pm),'out'),
  pc=(a,b)=>b?(a>=b?'▲ ':'▼ ')+Math.abs(Math.round((a-b)/b*100))+'%':'—';
  const rec=[...S.tx].filter(t=>mk(t.date)==m&&(!ACC||t.acc==ACC||t.to==ACC)).sort(cmp(-1)).slice(0,6);
  return `<div class="greet"><small>${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}</small><h1>${hi()}.</h1><p class="qt">${quote()}</p></div>${ctl()}<section class="hero"><div class="sky">${doo(0)}</div>${Array.from({length:9},(_,i)=>`<i class="dot" style="left:${8+i*10}%;animation-delay:${i*.9}s"></i>`).join('')}<div class="tag"><div class="mut2">${ACC?esc(accName(ACC)):'Total saldo tersedia'}</div><div class="big cu" data-v="${shown()}">${sec(shown())}</div><button class="b s" onclick="S.hide^=1;save();render()">${S.hide?'Tampilkan':'Sembunyikan'}</button></div></section>
  <div class="strip"><div><span>Pemasukan</span><b class="pos cu" data-v="${I}">${sec(I)}</b><em>${pc(I,pI)} vs bln lalu</em></div><div><span>Pengeluaran</span><b class="neg cu" data-v="${E}">${sec(E)}</b><em>${pc(E,pE)} vs bln lalu</em></div><div><span>Kas bersih</span><b class="cu" data-v="${I-E}">${sec(I-E)}</b><em>bulan ini</em></div></div>
  ${remind()}<h2>Akun</h2>${S.acc.length?`<div class="rail">${S.acc.map(a=>acard(a)).join('')}</div>`:empty('Belum ada akun. Buat akun pertama di menu Akun.')}
  <h2>Pemasukan vs pengeluaran</h2><div class="card scroll">${bars()}</div>
  <h2>Pengeluaran per kategori</h2><div class="card">${catDist(inM(m))}</div>
  <h2>Distribusi saldo</h2><div class="card">${S.acc.length&&total()>0?S.acc.filter(a=>bal(a)>0).map(a=>`<div style="margin:8px 0"><div class="mut">${esc(a.name)} · ${Math.round(bal(a)/total()*100)}%</div><div class="bar"><i style="width:${bal(a)/total()*100}%;background:${a.color}"></i></div></div>`).join(''):empty('Belum ada saldo.')}</div>
  <h2>Transaksi terbaru</h2><div class="card">${rec.length?rec.map(txRow).join(''):empty('Belum ada transaksi.')}</div><button class="b g" onclick="go('tx')">Lihat semua</button>`;
}
function bars(){
  if(!S.tx.length)return empty('Grafik akan muncul setelah ada transaksi.');
  let ms=[],m=curM();for(let i=0;i<6;i++){ms.unshift(m);m=prevM(m)}
  const d=ms.map(m=>[m,sum(inM(m),'in'),sum(inM(m),'out')+fees(inM(m))]),mx=Math.max(1,...d.map(x=>Math.max(x[1],x[2])));
  const P=k=>d.map((x,i)=>[36+i*98,150-x[k]/mx*118]),sm=p=>p.reduce((a,c,i)=>{if(!i)return`M${c[0]} ${c[1]}`;const q=p[i-1],cx=(q[0]+c[0])/2;return a+`C${cx} ${q[1]} ${cx} ${c[1]} ${c[0]} ${c[1]}`},'');
  const a=P(1),b=P(2),ar=p=>sm(p)+`L${p[5][0]} 160L${p[0][0]} 160Z`;
  return `<svg viewBox="0 0 520 190" style="width:100%;min-width:340px"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8c78" stop-opacity=".35"/><stop offset="1" stop-color="#5b8c78" stop-opacity="0"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b26d68" stop-opacity=".28"/><stop offset="1" stop-color="#b26d68" stop-opacity="0"/></linearGradient></defs>
  ${[0,1,2].map(i=>`<line x1="20" x2="500" y1="${32+i*59}" y2="${32+i*59}" stroke="#E1E4E3" stroke-dasharray="3 5"/>`).join('')}
  <path class="ar" d="${ar(a)}" fill="url(#g1)"/><path class="ar" d="${ar(b)}" fill="url(#g2)"/>
  <path class="ln" pathLength="1" d="${sm(a)}" stroke="#5b8c78"/><path class="ln" pathLength="1" d="${sm(b)}" stroke="#b26d68"/>
  ${a.map((p,i)=>`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#5b8c78" stroke-width="2"><title>Masuk ${fmt(d[i][1])}</title></circle>`).join('')}${b.map((p,i)=>`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#b26d68" stroke-width="2"><title>Keluar ${fmt(d[i][2])}</title></circle>`).join('')}
  ${d.map((x,i)=>`<text x="${36+i*98}" y="182" text-anchor="middle" font-size="11" fill="#4A5C6A">${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][+x[0].slice(5)-1]}</text>`).join('')}</svg><div class="mut"><span class="pos">●</span> Pemasukan &nbsp; <span class="neg">●</span> Pengeluaran</div>`;
}
function catDist(f){
  const o={};S.tx.filter(t=>t.type=='out'&&f(t.date)&&(!ACC||V!='ov'||t.acc==ACC)).forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amt);
  const e=Object.entries(o).sort((a,b)=>b[1]-a[1]),T=e.reduce((s,x)=>s+x[1],0);if(!e.length)return empty('Belum ada pengeluaran pada periode ini.');
  const C=2*Math.PI*54;let acc=0;
  return `<div class="dn"><svg viewBox="0 0 140 140" width="180" height="180"><circle cx="70" cy="70" r="54" fill="none" stroke="#E6E9E8" stroke-width="14"/>${e.map(([c,v],i)=>{const l=v/T*C,r=`<circle class="sg" cx="70" cy="70" r="54" stroke="${PAL[i%7]}" style="--l:${Math.max(l-2.5,.5)};animation-delay:${i*.12}s" stroke-dashoffset="${-acc}"><title>${esc(c)}: ${fmt(v)}</title></circle>`;acc+=l;return r}).join('')}<text x="70" y="65" text-anchor="middle" font-size="8" fill="#4A5C6A" letter-spacing="2">TOTAL</text><text x="70" y="82" text-anchor="middle" font-size="12" font-family="Fraunces,Georgia,serif" fill="#06141B">${S.hide?'•••':fmt(T)}</text></svg><div class="lg">${e.map(([c,v],i)=>`<div class="lr"><i style="background:${PAL[i%7]}"></i><span>${esc(c)}</span><b>${Math.round(v/T*100)}%</b></div>`).join('')}</div></div>`;
}
/* Transactions */
const cmp=d=>(a,b)=>d*((a.date+a.time).localeCompare(b.date+b.time));
function txRow(t){
  const sg=t.type=='in'?'+':t.type=='out'?'−':t.type=='adj'?(t.amt<0?'−':'+'):'',cl=t.type=='in'||(t.type=='adj'&&t.amt>0)?'pos':t.type=='out'||(t.type=='adj')?'neg':'';
  const lbl={in:'Masuk',out:'Keluar',tf:'Transfer',adj:'Penyesuaian',sv:'Tabungan',dp:'Utang/cicilan'}[t.type];
  return `<div class="row tr"><div class="ic ${t.type}">${{in:'↓',out:'↑',tf:'⇄',adj:'±',sv:'◎',dp:'◷'}[t.type]}</div><div class="tm"><b>${esc(t.title)}</b><div class="mut">${esc(t.subcat?(t.cat+' / '+t.subcat):(t.cat||lbl))} · ${t.type=='tf'?esc(accName(t.acc))+' → '+esc(accName(t.to)):t.type=='sv'?esc(accName(t.acc))+' → tabungan':esc(accName(t.acc))} · ${fd(t.date)}${t.time?' · '+t.time:''}${t.tags?' · #'+esc(t.tags):''}</div></div>
  <div class="rt" style="text-align:right;white-space:nowrap"><b class="${cl}">${sg}${sec(Math.abs(t.amt))}</b><div><button class="b g s" onclick="txForm('${t.id}')">Ubah</button> <button class="b g s" onclick="delTx('${t.id}')">Hapus</button></div></div></div>`;
}
function tx(){
  const o=(a,v)=>a.map(x=>`<option value="${x[0]}" ${F[v]==x[0]?'selected':''}>${esc(x[1])}</option>`).join('');
  const chips=[['','Semua'],['in','Masuk'],['out','Keluar'],['tf','Transfer'],['adj','Penyesuaian']];
  return `<div class="eyebrow">Riwayat</div><h1>Transaksi</h1>
  <div class="search"><span>${ic('<circle cx="11" cy="11" r="6.5" fill="none"/><path d="M16 16l4 4"/>')}</span><input placeholder="Cari transaksi, kategori, tag…" value="${esc(F.q)}" oninput="F.q=this.value;list()"></div>

function range(){
  const t=new Date(),iso=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())},td=iso(t);
  if(P=='week'){const d=new Date(t);d.setDate(t.getDate()-((t.getDay()+6)%7));return[iso(d),td]}
  if(P=='month')return[td.slice(0,7)+'-01',td];
  if(P=='last'){const p=prevM(td.slice(0,7));return[p+'-01',p+'-31']}
  if(P=='year')return[td.slice(0,4)+'-01-01',td];
  return[F.from||'0000',F.to||'9999'];
}

function qaAdd(){const n=$('qan').value.trim();if(!n)return;const a={id:uid(),name:n,type:'Bank',open:0,color:COLORS[S.acc.length%6]};S.acc.push(a);save();['f_acc','f_to'].forEach(i=>{const e=$(i);if(e)e.insertAdjacentHTML('beforeend',`<option value="${a.id}">${esc(n)}</option>`)});$('f_acc').value=a.id;$('qan').value='';$('qab').classList.remove('open');toast('Akun ditambahkan')}
function qaug(id){const gc=$('g_cat');if(!gc||$('qcl'))return;
 gc.insertAdjacentHTML('beforeend','<a class="lk" id="qcl" onclick="qcT()">Kategori belum ada? <u>Tambah baru</u></a><div class="qa" id="qcb"><input id="qcn" placeholder="Nama kategori baru"><button class="b s" type="button" onclick="qcAdd()">Tambah</button></div>');
 $('f_acc').insertAdjacentHTML('afterend','<a class="lk" onclick="qaT()">Butuh akun baru? <u>Tambah di sini</u></a><div class="qa" id="qab"><input id="qan" placeholder="Nama akun baru"><button class="b s" type="button" onclick="qaAdd()">Tambah</button></div>');
 const am=$('f_amt');am.insertAdjacentHTML('afterend','<div class="mut" id="f_pv"></div>');am.addEventListener('input',()=>{$('f_pv').textContent=am.value&&isFinite(+am.value)?fmt(+am.value):''});
 $('f_tags').insertAdjacentHTML('afterend','<label>Lampirkan foto struk <em style="text-transform:none;letter-spacing:0">(opsional)</em></label><input id="f_img" type="file" accept="image/*"><div id="f_ip"></div>');
 window.__img=null;
 $('f_img').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);window.__img=c.toDataURL('image/jpeg',.62);$('f_ip').innerHTML=`<img src="${window.__img}" alt="Pratinjau struk" style="width:100%;border-radius:14px;margin-top:8px">`};im.src=r.result};r.readAsDataURL(f)});
 const o=_ok;_ok=function(){const e=o();if(!e&&window.__img){const t=id?S.tx.find(x=>x.id==id):S.tx[S.tx.length-1];if(t){t.img=window.__img;save();render()}}if(!e)window.__img=null;return e}}
const _tf7=txForm;txForm=function(id,pre){_tf7(id,pre);qaug(id)};
const _tr7=txRow;txRow=function(t){let h=_tr7(t);if(t.img)h=h.replace('<button class="b g s" onclick="txForm(','<button class="b g s" onclick="showImg(\''+t.id+'\')">Struk</button> <button class="b g s" onclick="txForm(');return h};
function showImg(id){const t=S.tx.find(x=>x.id==id);if(!t||!t.img)return;dlg('Foto struk',`<img src="${t.img}" alt="Struk" style="width:100%;border-radius:14px">`,()=>{dlgClose()});const b=$('dlg').querySelector('button:last-child');if(b)b.textContent='Tutup'}
</script></body></html>
